<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Halofall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Big+Shoulders+Display:wght@700;800;900&display=swap">
<style>
/* Layout: sticky top bar, then lobby = party/friends rail | shared 3D stage | play panel.
   Locker, shop, pass and quests reuse the same shell. Phones stack stage-first with a bottom nav.
   Single committed look: dusk-violet ink, ember accent, sky-cyan secondary. */
:root{
  --ink:#0d0b1c; --ink2:#161329; --ink3:#211c3b; --line:#322c58;
  --text:#f2effc; --mute:#9d97c7; --accent:#ff6a3d; --accent2:#5ee1ff;
  --good:#5be37d; --warn:#ffc83d; --bad:#ff4d6d;
  --r-common:#9aa3b8; --r-uncommon:#5be37d; --r-rare:#3da8ff; --r-epic:#b45cff; --r-legendary:#ffc83d;
  --font-display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --font-body:'Archivo','Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--ink);color:var(--text);font:15px/1.45 var(--font-body);padding-inline:clamp(16px,2.4vw,32px);padding-block:0 32px}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
button:disabled{cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
h1,h2,h3{margin:0;font-family:var(--font-display);text-transform:uppercase;letter-spacing:.03em;text-wrap:balance;line-height:1.05}
p{margin:0}
svg{display:block}
.app{max-width:1500px;margin:0 auto}
.mut{color:var(--mute)}
.r-common{--rc:var(--r-common)}.r-uncommon{--rc:var(--r-uncommon)}.r-rare{--rc:var(--r-rare)}.r-epic{--rc:var(--r-epic)}.r-legendary{--rc:var(--r-legendary)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:14px 20px;flex-wrap:wrap;padding-block:12px;background:linear-gradient(var(--ink) 78%,rgba(13,11,28,0))}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:900;font-size:30px;letter-spacing:.08em;font-style:italic;text-transform:uppercase}
.nav{display:flex;gap:2px;margin-inline:auto}
.nav button{position:relative;padding:8px 16px;font-family:var(--font-display);font-weight:800;font-size:21px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.nav button:hover{color:var(--text)}
.nav button::after{content:'';position:absolute;left:12px;right:12px;bottom:0;height:3px;background:var(--accent);transform:skewX(-24deg);opacity:0;transition:opacity .15s}
.nav button[aria-current=page]{color:var(--text)}
.nav button[aria-current=page]::after{opacity:1}
.nav .dot{position:absolute;top:6px;right:6px;width:9px;height:9px;border-radius:50%;background:var(--accent2)}
.res{display:flex;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;background:var(--ink2);border:1px solid var(--line);border-radius:4px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip.me svg{width:26px;height:26px;border-radius:3px;background:var(--ink3)}
button.chip:hover{border-color:var(--accent2)}
.qbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 14px;margin-bottom:12px;background:var(--ink3);border:1px solid var(--accent);border-radius:4px}

/* panels */
.panel{background:var(--ink2);border:1px solid var(--line);border-radius:6px;min-width:0}
.panel>h2{font-size:22px;padding:12px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.panel>h2 span{font-family:var(--font-body);font-size:13px;letter-spacing:0;text-transform:none;color:var(--mute);font-weight:600}
.pad{padding:14px}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;font-weight:700;border-radius:4px;background:var(--ink3);border:1px solid var(--line);text-align:center}
.btn:hover:not(:disabled){border-color:var(--accent2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#1d0b04}
.btn.pri:hover:not(:disabled){filter:brightness(1.1);border-color:var(--accent)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.4}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;background:var(--ink3);padding:2px;border-radius:5px}
.seg button{padding:8px 4px;font-weight:600;border-radius:4px;color:var(--mute);text-align:center}
.seg button[aria-pressed=true]{background:var(--text);color:var(--ink)}
.seg button:disabled{opacity:.3}
.bar{height:10px;background:var(--ink3);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#ffb27a)}
.vb{display:inline-block;vertical-align:-3px;flex:none}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}

/* lobby grid */
.lobby{display:grid;grid-template-columns:300px minmax(0,1fr) 330px;gap:16px;align-items:start}
.stage-col{min-width:0}
@media(max-width:1180px){.lobby{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.lobby .stage-col{grid-column:1/-1;order:-1}}
@media(max-width:720px){.lobby{grid-template-columns:minmax(0,1fr)}}

/* stage */
.stage{position:relative;height:clamp(400px,68vh,700px);overflow:hidden;border-radius:6px;border:1px solid var(--line);
  background:radial-gradient(110% 60% at 50% 100%,rgba(255,106,61,.38),transparent 62%),linear-gradient(180deg,#171040 0%,#3a1f5e 52%,#7a3555 84%,#c4553f 100%)}
.stage::after{content:'';position:absolute;left:-30%;right:-30%;bottom:0;height:40%;pointer-events:none;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.09) 0 1px,transparent 1px 64px),repeating-linear-gradient(0deg,rgba(255,255,255,.09) 0 1px,transparent 1px 44px);
  transform:perspective(420px) rotateX(62deg);transform-origin:bottom;-webkit-mask-image:linear-gradient(to top,#000,transparent);mask-image:linear-gradient(to top,#000,transparent)}
.halo{position:absolute;left:50%;top:46%;width:min(78%,520px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;
  border:3px solid rgba(255,200,140,.55);box-shadow:0 0 60px rgba(255,140,80,.45),inset 0 0 70px rgba(255,140,80,.25)}
.cv{position:absolute;inset:0;width:100%;height:100%;touch-action:pan-y;cursor:grab;z-index:1}
.cv:active{cursor:grabbing}
.tags{position:absolute;inset:0;pointer-events:none;z-index:2}
.tag{position:absolute;left:0;top:0;white-space:nowrap;text-align:center;padding:4px 10px;background:rgba(13,11,28,.8);border:1px solid var(--line);border-radius:3px;font-size:12px;color:var(--mute)}
.tag b{display:block;font-family:var(--font-display);font-size:18px;letter-spacing:.05em;text-transform:uppercase;color:var(--text)}
.tag.me{border-color:var(--accent)}
.emotebar{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);z-index:3;display:flex;gap:8px;padding:8px;max-width:calc(100% - 24px);background:rgba(13,11,28,.74);border:1px solid var(--line);border-radius:6px}
.emotebar button{position:relative;width:46px;height:46px;border-radius:4px;background:var(--ink3);border:1px solid var(--line);flex:none}
.emotebar button:hover{border-color:var(--accent2)}
.emotebar svg{width:100%;height:100%}
.emotebar kbd{position:absolute;top:1px;left:4px;font:600 10px var(--font-body);color:var(--mute)}
.stage.locker .emotebar,.stage.locker .tags{display:none}
.fb{position:absolute;inset:0;z-index:2;display:flex;justify-content:center;align-items:flex-end;gap:12px;padding:24px 12px 70px}
.fb figure{margin:0;width:min(150px,24%);text-align:center}
.fb svg{width:100%}
.stagehint{position:absolute;right:12px;top:10px;z-index:3;font-size:12px;color:rgba(255,255,255,.65);pointer-events:none}

/* party + friends */
.slot{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line)}
.slot .av{width:44px;height:44px;border-radius:4px;background:var(--ink3);overflow:hidden}
.slot .av svg{width:100%;height:100%}
.slot b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot small{color:var(--mute);font-size:12px}
.slot.empty{grid-template-columns:minmax(0,1fr)}
.slot.empty button{width:100%;padding:10px;border:1px dashed var(--line);border-radius:4px;color:var(--mute);font-weight:600;text-align:center}
.slot.empty button:hover{border-color:var(--accent2);color:var(--text)}
.sdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--mute)}
.sdot.online,.sdot.lobby{background:var(--good)}.sdot.match{background:var(--warn)}.sdot.away{background:var(--accent)}
.lower{padding:10px 14px 14px;display:flex;flex-direction:column;gap:10px}
.flist{max-height:260px;overflow:auto;margin-inline:-14px}
.chat{display:flex;flex-direction:column;gap:8px}
.chatlog{height:150px;overflow:auto;background:var(--ink);border:1px solid var(--line);border-radius:4px;padding:8px;font-size:13px;display:flex;flex-direction:column;gap:4px}
.chatlog b{color:var(--accent2)}
.chatlog b.you{color:var(--accent)}
input[type=text],select{width:100%;padding:9px 10px;background:var(--ink);color:var(--text);border:1px solid var(--line);border-radius:4px;font:inherit}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>input{flex:1;min-width:0}

/* play panel */
.modeart{position:relative;padding:18px 16px 16px;overflow:hidden;border-bottom:1px solid var(--line);
  background:radial-gradient(120% 140% at 100% 0%,color-mix(in srgb,var(--h) 55%,transparent),transparent 62%),var(--ink3)}
.modeart::after{content:'';position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;border:3px solid color-mix(in srgb,var(--h) 70%,#fff);opacity:.5}
.modeart h3{font-size:38px;font-weight:900;margin:4px 0 6px}
.modeart p{color:#d8d3f2;max-width:30ch;margin-bottom:12px}
.play{display:block;width:100%;padding:16px 20px 14px;background:var(--accent);color:#1d0b04;text-align:center;
  clip-path:polygon(5% 0,100% 0,95% 100%,0 100%);font-family:var(--font-display);font-weight:900;font-size:54px;line-height:1;letter-spacing:.08em;text-transform:uppercase;transition:filter .15s,transform .15s}
.play:hover{filter:brightness(1.1);transform:translateY(-2px)}
.play small{display:block;margin-top:5px;font-family:var(--font-body);font-size:12px;font-weight:700;letter-spacing:.14em}
.qbox{padding:14px;border:1px solid var(--accent);border-radius:4px;background:var(--ink3);text-align:center;display:flex;flex-direction:column;gap:10px}
.qbox .big{font-family:var(--font-display);font-weight:900;font-size:46px;line-height:1;font-variant-numeric:tabular-nums}
.spin{width:30px;height:30px;margin:0 auto;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ready{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--mute)}
.ready i{font-style:normal;color:var(--good)}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
.kv b{color:var(--text);font-weight:600}
.found{font-family:var(--font-display);font-weight:900;font-size:44px;color:var(--good);animation:pop .4s ease-out}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.card{position:relative;display:flex;flex-direction:column;min-width:0;overflow:hidden;border:1px solid var(--line);border-bottom:3px solid var(--rc,var(--line));border-radius:4px;
  background:var(--ink3);background:linear-gradient(165deg,color-mix(in srgb,var(--rc) 30%,var(--ink3)),var(--ink2) 72%)}
.card:hover{border-color:var(--rc)}
.card>svg{width:100%;aspect-ratio:1/1;max-width:100%}
.card .meta{display:flex;flex-direction:column;gap:2px;padding:8px 10px 10px;min-width:0}
.card .meta b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .meta small{color:var(--mute);font-size:12px}
.card .price{display:flex;align-items:center;gap:6px;margin-top:4px;font-weight:700;font-variant-numeric:tabular-nums}
.card .own{margin-top:4px;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--good)}
.card .badge{position:absolute;top:8px;left:8px;padding:2px 8px;border-radius:3px;background:var(--text);color:var(--ink);font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.card.sel{outline:2px solid var(--text);outline-offset:-2px}
.card.big{flex-direction:row;align-items:stretch}
.card.big>svg{width:46%;flex:none}
.card.big .meta{justify-content:center;padding:14px}
.card.big .meta b{font-family:var(--font-display);font-size:30px;text-transform:uppercase;white-space:normal;line-height:1}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.sect{margin-bottom:26px}
.sect>h2{font-size:28px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.sect>h2 span{font-family:var(--font-body);font-size:14px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--mute);font-variant-numeric:tabular-nums}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.pagehead h1{font-size:54px;font-weight:900}

/* locker */
.locker{display:grid;grid-template-columns:210px minmax(0,1fr) minmax(300px,420px);gap:16px;align-items:start}
.cats{display:flex;flex-direction:column;padding:6px}
.cats button{display:flex;flex-direction:column;gap:2px;padding:12px;border-radius:4px;border-left:3px solid transparent}
.cats button:hover{background:var(--ink3)}
.cats button[aria-pressed=true]{background:var(--ink3);border-left-color:var(--accent)}
.cats b{font-family:var(--font-display);font-size:22px;text-transform:uppercase;letter-spacing:.05em}
.cats small{color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:1180px){.locker{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.locker .stage-col{grid-column:1/-1;order:-1}.cats{flex-direction:row;overflow-x:auto}.cats button{flex:none;min-width:130px}}
@media(max-width:720px){.locker{grid-template-columns:minmax(0,1fr)}}

/* battle pass */
.passhead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center;padding:18px;margin-bottom:12px;
  background:radial-gradient(90% 160% at 0% 0%,rgba(255,106,61,.28),transparent 60%),var(--ink2)}
.passhead .tiern{font-family:var(--font-display);font-weight:900;font-size:76px;line-height:.9}
@media(max-width:720px){.passhead{grid-template-columns:minmax(0,1fr)}}
.rail{position:relative;overflow-x:auto;display:grid;grid-auto-flow:column;grid-auto-columns:136px;gap:8px;padding:6px 2px 16px}
.tier{display:grid;grid-template-rows:auto 168px 168px;gap:6px}
.tier>h3{font-size:22px;text-align:center;color:var(--mute)}
.tier.cur>h3{color:var(--accent)}
.tier.reached>h3{color:var(--text)}
.rw{display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:4px;padding:8px;min-width:0;border:1px solid var(--line);border-radius:4px;background:var(--ink2);text-align:center}
.rw.empty{border-style:dashed;opacity:.35}
.rw svg{width:84px;height:84px}
.rw .coin{height:84px;display:grid;place-items:center}
.rw span{font-size:12px;font-weight:600;line-height:1.2;width:100%;overflow:hidden;text-overflow:ellipsis}
.rw em{font-style:normal;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.rw.can{border-color:var(--accent);background:var(--ink3)}
.rw.can em{color:var(--accent)}
.rw.done em{color:var(--good)}
.rw.done{opacity:.6}
.rw[class*=r-]{border-bottom:3px solid var(--rc)}
.trackname{display:flex;gap:10px;margin-bottom:6px;font-size:13px;color:var(--mute)}

/* quests */
.q{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px;align-items:center;padding:14px;border-bottom:1px solid var(--line)}
.q:last-child{border-bottom:0}
.q b{font-size:16px}
.q .bar{grid-column:1/-1}
.q .xp{font-weight:700;color:var(--accent2);font-variant-numeric:tabular-nums}
.cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;align-items:start}

/* modal, toast, match overlay */
.modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:16px;background:rgba(6,4,16,.74)}
.sheet{position:relative;width:min(480px,100%);max-height:100%;overflow:auto;background:var(--ink2);border:1px solid var(--line);border-top:4px solid var(--rc,var(--accent));border-radius:8px;padding:22px;display:flex;flex-direction:column;gap:14px}
.sheet h2{font-size:34px;font-weight:900}
.xbtn{position:absolute;top:8px;right:10px;width:34px;height:34px;font-size:26px;line-height:1;color:var(--mute);text-align:center}
.bigicon{width:min(220px,60%);margin-inline:auto;border-radius:6px;overflow:hidden;background:linear-gradient(165deg,color-mix(in srgb,var(--rc,var(--accent)) 35%,var(--ink3)),var(--ink2))}
.bigicon svg{width:100%;aspect-ratio:1/1}
.pricebig{display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-weight:900;font-size:36px}
.warn{color:var(--warn);font-size:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.stats div{padding:10px 4px;background:var(--ink3);border-radius:4px}
.stats b{display:block;font-family:var(--font-display);font-size:28px}
.stats small{color:var(--mute);font-size:11px}
.mode{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:14px;border:1px solid var(--line);border-radius:4px;background:var(--ink3);text-align:left}
.mode[aria-pressed=true]{border-color:var(--accent2)}
.mode:disabled{opacity:.45}
.mode b{font-family:var(--font-display);font-size:24px;text-transform:uppercase}
.toasts{position:fixed;left:0;right:0;bottom:24px;z-index:80;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding-inline:16px}
.toast{padding:10px 16px;background:var(--text);color:var(--ink);font-weight:700;border-radius:4px;box-shadow:0 8px 24px rgba(0,0,0,.4);animation:pop .25s ease-out}
.match{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:24px;text-align:center;
  background:radial-gradient(70% 60% at 50% 100%,rgba(255,106,61,.35),transparent 70%),linear-gradient(180deg,#120d33,#2a1650 70%,#5a2a55)}
.mbox{width:min(640px,100%);display:flex;flex-direction:column;align-items:center;gap:16px}
.mbox h1{font-size:clamp(40px,8vw,78px);font-weight:900}
.mbox .bar{width:100%;height:12px}
.mbox .glide{width:min(200px,50vw)}
.mbox .glide svg{width:100%;aspect-ratio:1/1}
.note{max-width:46ch;color:#d8d3f2}
.result{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.result div{padding:14px 6px;background:rgba(13,11,28,.6);border:1px solid var(--line);border-radius:4px}
.result b{display:block;font-family:var(--font-display);font-size:40px;line-height:1}
.result small{color:var(--mute)}

@media(max-width:820px){
  body{padding-bottom:92px}
  .top{gap:10px}
  .brand{font-size:26px}
  .res{margin-left:auto}
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:40;margin:0;justify-content:space-around;background:var(--ink2);border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px))}
  .nav button{padding:10px 6px;font-size:15px;letter-spacing:.04em}

function pose(r,t,anim,et){
 const s=Math.sin,PI=Math.PI,ph=r.ph;

 r.armL.el.rotation.set(-.18,0,0);r.armR.el.rotation.set(-.18,0,0);
 r.legL.rotation.set(0,0,0);r.legR.rotation.set(0,0,0);
 r.hips.position.y=1.05+s(t*1.8+ph)*.012;r.hips.rotation.set(0,0,0);
 r.torso.rotation.set(0,0,s(t*.9+ph)*.02);r.head.rotation.set(0,s(t*.6+ph)*.2,0);
 r.body.rotation.y=0;r.body.position.y=0;r.pickG.visible=!anim;
 const c=r.ctrl;
 if(c.ring){c.ring.rotation.x=t*1.2;c.ring.rotation.y=t*.7}
 if(c.drone){c.drone.position.y=1.5+s(t*2+ph)*.07;c.drone.position.x=.75+s(t*1.1)*.08}
 if(c.cape){c.cape.rotation.x=.1+s(t*1.4+ph)*.05}
 if(!anim)return;
 switch(anim){
  case 'wave':r.armR.sh.rotation.set(0,0,2.5);r.armR.el.rotation.set(0,0,s(et*9)*.55);r.torso.rotation.z=-.06;r.head.rotation.z=.12;break;
  case 'dance':{const b=s(et*6.28);r.hips.position.y+=Math.abs(b)*.07-.05;r.hips.rotation.y=s(et*3.14)*.4;r.torso.rotation.y=-s(et*3.14)*.35;r.armL.sh.rotation.set(-1.4+b*.5,0,-.5);r.armR.sh.rotation.set(-1.4-b*.5,0,.5);r.armL.el.rotation.set(-1.1,0,0);r.armR.el.rotation.set(-1.1,0,0);r.legL.rotation.x=s(et*3.14)*.45;r.legR.rotation.x=-s(et*3.14)*.45;r.head.rotation.y=-s(et*3.14)*.3;break}
  case 'flex':{const p=s(et*8)*.08;r.hips.position.y-=.05;r.armL.sh.rotation.set(0,0,-1.5);r.armR.sh.rotation.set(0,0,1.5);r.armL.el.rotation.set(0,0,-1.5-p);r.armR.el.rotation.set(0,0,1.5+p);r.legL.rotation.z=-.14;r.legR.rotation.z=.14;r.torso.rotation.y=s(et*2)*.25;break}

  case 'win':r.armL.sh.rotation.set(0,0,-2.9);r.armR.sh.rotation.set(0,0,2.9);r.armL.el.rotation.set(0,0,-s(et*10)*.3);r.armR.el.rotation.set(0,0,s(et*10)*.3);r.body.position.y=Math.abs(s(et*5))*.14;r.head.rotation.x=-.2;break;
  case 'stomp':{const k=s(et*5);r.legL.rotation.x=-Math.max(0,k)*1.1;r.legR.rotation.x=-Math.max(0,-k)*1.1;r.hips.position.y+=Math.abs(k)*.04;r.armL.sh.rotation.set(-.8+k*.5,0,-.35);r.armR.sh.rotation.set(-.8-k*.5,0,.35);r.armL.el.rotation.set(-1.3,0,0);r.armR.el.rotation.set(-1.3,0,0);break}
 }
}

 function layout(){const n=Math.max(1,Math.min(4,heroes.length));const L=LAYOUT[n];heroes.forEach((h,i)=>{h.tx=L[i][0];h.tz=L[i][1];if(h.fresh){h.x=h.tx;h.z=h.tz;h.ry=0;h.fresh=false}})}

 function frame(now){
  if(!active||!ok){running=false;return}
  requestAnimationFrame(frame);
  const t=now/1000,dt=Math.min(.05,Math.max(0,t-last));last=t;
  if(!W||!H)resize();
  const d=camTarget();curD+=(d-curD)*Math.min(1,dt*4);
  const ty=mode==='locker'?1.2:1.05;camera.position.set(0,ty+.35,curD);camera.lookAt(0,ty,0);
  const pa=pts.geometry.attributes.position;for(let i=0;i<pa.count;i++){let y=pa.getY(i)+dt*(reduceMotion?0:.18);if(y>4.5)y=0;pa.setY(i,y)}pa.needsUpdate=true;
  const v=new THREE.Vector3();

   h.x+=(h.tx-h.x)*Math.min(1,dt*5);h.z+=(h.tz-h.z)*Math.min(1,dt*5);
   if(!drag||i>0){const base=mode==='locker'&&i===0&&!reduceMotion?h.ry+dt*.5:-h.tx*.12;if(mode==='locker'&&i===0)h.ry=base;else h.ry+=(base-h.ry)*Math.min(1,dt*3)}

const SIM=(function(){
'use strict';
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};
const angDiff=(a,b)=>{let d=a-b;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return d};
function mulberry(seed){let a=seed>>>0;return function(){a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}
function makeNoise(seed){const r=mulberry(seed);const perm=[];for(let i=0;i<256;i++)perm.push(i);for(let i=255;i>0;i--){const j=Math.floor(r()*(i+1));const x=perm[i];perm[i]=perm[j];perm[j]=x}
 const P=new Uint8Array(512);for(let i=0;i<512;i++)P[i]=perm[i&255];
 const g=(ix,iz)=>P[(P[ix&255]+iz)&255]/255;
 return (x,z)=>{const ix=Math.floor(x),iz=Math.floor(z),fx=x-ix,fz=z-iz;const u=fx*fx*(3-2*fx),v=fz*fz*(3-2*fz);const a=g(ix,iz),b=g(ix+1,iz),c=g(ix,iz+1),d=g(ix+1,iz+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}}

function angleTo(ax,az,bx,bz){return Math.atan2(bx-ax,bz-az)}
function norm3(d){const l=Math.hypot(d.x,d.y,d.z)||1;return {x:d.x/l,y:d.y/l,z:d.z/l}}
function perturb(d,sp){if(sp<=0)return d;let rx=d.z,rz=-d.x;let rl=Math.hypot(rx,rz);if(rl<1e-5){rx=1;rz=0;rl=1}rx/=rl;rz/=rl;
 const ux=-d.y*rz,uy=d.z*rx-d.x*rz,uz=d.y*rx;const ul=Math.hypot(ux,uy,uz)||1;
 const a=(Math.random()+Math.random()-1)*sp,b=(Math.random()+Math.random()-1)*sp;
 return norm3({x:d.x+rx*a+ux/ul*b,y:d.y+uy/ul*b,z:d.z+rz*a+uz/ul*b})}
function rayBox(ox,oy,oz,dx,dy,dz,b,maxT){let t0=0,t1=maxT;
 const o=[ox,oy,oz],d=[dx,dy,dz],mn=[b.x0,b.y0,b.z0],mx=[b.x1,b.y1,b.z1];
 for(let i=0;i<3;i++){if(Math.abs(d[i])<1e-9){if(o[i]<mn[i]||o[i]>mx[i])return -1}else{let a=(mn[i]-o[i])/d[i],c=(mx[i]-o[i])/d[i];if(a>c){const s=a;a=c;c=s}if(a>t0)t0=a;if(c<t1)t1=c;if(t0>t1)return -1}}

function rayCyl(ox,oy,oz,dx,dy,dz,cx,cz,r,y0,y1,maxT){const px=ox-cx,pz=oz-cz;const a=dx*dx+dz*dz;if(a<1e-9)return -1;const b=px*dx+pz*dz,c=px*px+pz*pz-r*r;

function buildWorld(seed){
 const r=mulberry(seed),n1=makeNoise(seed+11),n2=makeNoise(seed+23);
 const fbm=(x,z)=>{let a=.5,f=1,s=0;for(let i=0;i<5;i++){s+=a*n1(x*f,z*f);a*=.5;f*=2.03}return s};
 const base=(x,z)=>{const d=Math.hypot(x,z);const warp=(n2(x*.015,z*.015)-.5)*60;const mk=1-sstep(88,160,d+warp);const e=fbm(x*.011,z*.011);const hills=Math.max(0,e-.4)*90;return mk*(4+hills)-(1-mk)*14+(n2(x*.09,z*.09)-.5)*1.4*mk};
 const PN=['Cinder Docks','Glass Fields','Moss Hollow','Ridge Keep','Quartz Quarry','Halo Tower'];
 const pois=[];
 for(let tr=0;tr<900&&pois.length<6;tr++){const a=r()*Math.PI*2,d=22+r()*78;const x=Math.cos(a)*d,z=Math.sin(a)*d;const b=base(x,z);if(b<4.5||b>20)continue;
  if(Math.abs(base(x+12,z)-b)>8||Math.abs(base(x,z+12)-b)>8)continue;if(pois.some(p=>Math.hypot(p.x-x,p.z-z)<64))continue;
  pois.push({name:PN[pois.length],x:x,z:z,r:26,h:clamp(b,4,14)})}
 const fb=[[-45,-40],[50,-35],[-40,50],[45,45],[0,5],[0,-70]];
 for(let i=0;pois.length<4&&i<fb.length;i++){const f=fb[i];if(pois.some(p=>Math.hypot(p.x-f[0],p.z-f[1])<60))continue;pois.push({name:PN[pois.length],x:f[0],z:f[1],r:26,h:6})}
 const raw=(x,z)=>{let h=base(x,z);for(let i=0;i<pois.length;i++){const p=pois[i];const dd=Math.hypot(x-p.x,z-p.z);const k=1-sstep(p.r*.75,p.r*1.4,dd);if(k>0)h=h*(1-k)+p.h*k}return h};
 const grid=new Float32Array(G*G);
 for(let iz=0;iz<G;iz++)for(let ix=0;ix<G;ix++)grid[iz*G+ix]=raw(-HALF+ix*STEP,-HALF+iz*STEP);
 function H(x,z){const fx=(x+HALF)/STEP,fz=(z+HALF)/STEP;if(fx<0||fz<0||fx>=G-1||fz>=G-1)return -14;const ix=Math.floor(fx),iz=Math.floor(fz),u=fx-ix,v=fz-iz;
  const a=grid[iz*G+ix],b=grid[iz*G+ix+1],c=grid[(iz+1)*G+ix],d=grid[(iz+1)*G+ix+1];return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
 /* spatial hash of obstacles */
 const cells=new Map();let oid=1;
 const ck=(cx,cz)=>(cx+3)*CN+(cz+3);
 function addObs(o,x0,x1,z0,z1){const cx0=Math.floor((x0+HALF)/CELL),cx1=Math.floor((x1+HALF)/CELL),cz0=Math.floor((z0+HALF)/CELL),cz1=Math.floor((z1+HALF)/CELL);
  for(let cx=cx0;cx<=cx1;cx++)for(let cz=cz0;cz<=cz1;cz++){const k=ck(cx,cz);let l=cells.get(k);if(!l){l=[];cells.set(k,l)}l.push(o)}}
 const boxes=[];
 function addBox(x0,x1,y0,y1,z0,z1,solid,part){const b={kind:'box',id:oid++,x0:x0,x1:x1,y0:y0,y1:y1,z0:z0,z1:z1,solid:solid,part:part};boxes.push(b);addObs(b,x0,x1,z0,z1);return b}
 /* houses */
 const houses=[];
 pois.forEach(p=>{let placed=0;for(let tr=0;tr<80&&placed<6;tr++){const a=r()*Math.PI*2,rad=placed===0?0:7+r()*10;const hx=p.x+Math.cos(a)*rad,hz=p.z+Math.sin(a)*rad;const hw=8+r()*2.4,hd=8+r()*1.6;
  if(houses.some(h=>Math.abs(h.x-hx)<(h.w+hw)/2+3&&Math.abs(h.z-hz)<(h.d+hd)/2+3))continue;
  let door;const dx=p.x-hx,dz=p.z-hz;if(Math.abs(dx)<1&&Math.abs(dz)<1)door='S';else if(Math.abs(dx)>Math.abs(dz))door=dx>0?'E':'W';else door=dz>0?'S':'N';
  houses.push({x:hx,z:hz,w:hw,d:hd,h:p.h,door:door,poi:p.name,wall:Math.floor(r()*5),roof:Math.floor(r()*3),walls:[]});placed++}});
 const T=.3,WH=3.2,DW=1.9;
 houses.forEach(h=>{const x0=h.x-h.w/2,x1=h.x+h.w/2,z0=h.z-h.d/2,z1=h.z+h.d/2,y0=h.h,y1=h.h+WH;
  function seg(alongX,fixed,a,b,ya,yb){const bb=alongX?addBox(a,b,ya,yb,fixed-T/2,fixed+T/2,true,'wall'):addBox(fixed-T/2,fixed+T/2,ya,yb,a,b,true,'wall');h.walls.push(bb)}

  if(slope>.55)c=mix(c,rock,Math.min(1,(slope-.55)*2.2));const j=(n-.5)*.07;return [c[0]+j,c[1]+j,c[2]+j]}

   const beam=new THREE.Mesh(new THREE.CylinderGeometry(.12,.12,5,6,1,true).translate(0,2.5,0),new THREE.MeshBasicMaterial({color:0xffd060,transparent:true,opacity:.28,depthWrite:false,blending:THREE.AdditiveBlending}));beam.position.set(c.x,c.y,c.z);scene.add(beam);chestV[c.id]={g:g,lid:lid,beam:beam,open:0}});

     if(e.victim===pl.id)onPlayerDown(m.ents[e.killer]);break}
    case 'pickup':if(e.id===pl.id){tone(520,.07,.12,'triangle');setTimeout(()=>tone(780,.08,.12,'triangle'),60)}break;
    case 'chest':{const cv=G.chestV[e.id];if(cv)cv.open=1;if(dist2cam(m.chests.find(c=>c.id===e.id).x,m.chests.find(c=>c.id===e.id).z)<40){tone(400,.1,.14,'triangle');setTimeout(()=>tone(600,.1,.14,'triangle'),100);setTimeout(()=>tone(900,.18,.14,'triangle'),200)}break}
    case 'zone':if(!m.clash)msg(e.s==='shrink'?'The storm is closing in':'A new safe zone is marked on the map',3.2);break;
    case 'eject':if(e.id===pl.id)msg('Space to open your glider',3);break;
    case 'deploy':if(e.id===pl.id)noise(.25,1500,500,.25,0);break;
    case 'storm':if(e.id===pl.id)tone(95,.3,.28,'sawtooth',70);break;
    case 'respawn':if(e.id===pl.id){G.dead=false;G.spec=null;el.gcard.hidden=true;el.gLeave.hidden=true;msg('Back in',1.8)}break;
    case 'healed':if(e.id===pl.id){tone(700,.12,.12,'sine');setTimeout(()=>tone(1000,.15,.12,'sine'),100)}break}}
  m.ev.length=0}
 function onPlayerDown(killer){const m=G.m,p=m.player;G.dead=true;G.spec=killer&&killer.alive?killer:null;if(document.exitPointerLock)try{document.exitPointerLock()}catch(e){}
  if(m.clash){msg('Down. Respawning in 3',2.6);return}
  setTimeout(()=>{if(!G||G.finished)return;card('<h2>Eliminated</h2><div class="result"><div><b>#'+(p.placement||'?')+'</b><small>Placement</small></div><div><b>'+p.kills+'</b><small>Eliminations</small></div><div><b>'+(killer?esc(killer.name):'Storm')+'</b><small>Eliminated by</small></div></div><div class="row" style="justify-content:center"><button class="btn" data-act="gspec">Keep watching</button><button class="btn pri" data-act="gdone">Leave match</button></div>')},900);
  el.gLeave.hidden=false}

 /* ---------- main loop ---------- */
 function frame(now){if(!G)return;G.raf=requestAnimationFrame(frame);const dt=Math.min(.05,Math.max(.001,(now-G.last)/1000));G.last=now;G.t+=dt;const m=G.m;
  if(!G.paused&&!G.finished){applyInput();G.acc+=dt;while(G.acc>=1/60){m.update(1/60);G.acc-=1/60}}
  handleEvents();
  if(m.over&&!G.finished)onOver();
  /* visuals */
  const cp=G.camP||camPose();const cam=G.cam;cam.position.set(cp.x,cp.y,cp.z);cam.lookAt(cp.x+cp.dir.x*50,cp.y+cp.dir.y*50,cp.z+cp.dir.z*50);
  if(Math.abs(cam.fov-cp.fov)>.05){cam.fov+=(cp.fov-cam.fov)*Math.min(1,dt*10);cam.updateProjectionMatrix()}
  G.sky.position.copy(cam.position);
  const pl=m.player;G.sun.position.set(pl.x+G.sunDir.x*100,pl.y+G.sunDir.y*100,pl.z+G.sunDir.z*100);G.sun.target.position.set(pl.x,pl.y,pl.z);
  for(let i=0;i<m.ents.length;i++){const e=m.ents[i],v=G.vis[e.id];const far=dist2cam(e.x,e.z)>230;
   v.root.visible=!(e.state==='bus')&&!far;if(!v.root.visible)continue;
   v.root.position.set(e.x,e.y,e.z);v.root.rotation.y=e.yaw;setGun(v,e);poseEnt(v,e,G.t,dt)}
  G.bus.position.set(m.bus.x,m.bus.y,m.bus.z);G.bus.rotation.y=Math.atan2(m.bus.dx,m.bus.dz);G.bus.visible=!m.clash&&m.bus.t<m.bus.dur+3&&m.bus.y>0;
  if(!m.clash){G.storm.position.set(m.zone.cx,100,m.zone.cz);G.storm.scale.set(m.zone.r,1,m.zone.r);if(m.zoneNext){G.nextZ.visible=true;G.nextZ.position.set(m.zoneNext.cx,60,m.zoneNext.cz);G.nextZ.scale.set(m.zoneNext.r,1,m.zoneNext.r)}else G.nextZ.visible=false}else{G.storm.visible=false;G.nextZ.visible=false}
  for(const id in G.chestV){const c=G.chestV[id];if(c.open>0&&c.open<2){c.open=Math.min(2,c.open+dt*3);c.lid.rotation.x=-1.25*Math.min(1,c.open)}if(c.open>=1&&c.beam.visible)c.beam.visible=false}
  syncItems(G.t);updateFx(dt);hud(dt);R.render(G.scene,cam)}
 function onOver(){const m=G.m,p=m.player;G.finished=true;if(document.exitPointerLock)try{document.exitPointerLock()}catch(e){}
  const win=m.winner===p.team;
  if(m.clash){card('<h2>'+(win?'Victory':'Defeat')+'</h2><div class="result"><div><b>'+m.score[0]+' : '+m.score[1]+'</b><small>Final score</small></div><div><b>'+p.kills+'</b><small>Eliminations</small></div><div><b>'+p.deaths+'</b><small>Downs</small></div></div><button class="btn pri" data-act="gdone">Continue</button>')}
  else card('<h2>'+(win?'Victory':'Match over')+'</h2><div class="result"><div><b>#'+(p.placement||(win?1:'?'))+'</b><small>Placement</small></div><div><b>'+p.kills+'</b><small>Eliminations</small></div><div><b>'+(m.winner===p.team?'Your squad':'Team '+m.winner)+'</b><small>Last standing</small></div></div><button class="btn pri" data-act="gdone">Continue</button>')}

 /* ---------- lifecycle ---------- */
 function start(opts,onEnd){
  if(!window.THREE)return false;grab();
  const w0=document.getElementById('game');w0.hidden=false;
  try{if(!R){R=new THREE.WebGLRenderer({canvas:el.gcv,antialias:!isTouch,powerPreference:'high-performance'});R.setClearColor(0x1a1030,1)}}catch(e){w0.hidden=true;return false}
  R.shadowMap.enabled=!isTouch;R.shadowMap.type=THREE.PCFSoftShadowMap;R.setPixelRatio(Math.min(window.devicePixelRatio||1,isTouch?1.5:1.75));R.setSize(window.innerWidth,window.innerHeight,false);
  const outfitIds=ITEMS.filter(i=>i.type==='outfit').map(i=>i.id);
  const m=SIM.createMatch({mode:opts.mode,size:opts.size,name:opts.name,outfit:opts.outfit,allies:opts.allies.map(a=>a.name),allyOutfits:opts.allies.map(a=>a.outfit),outfits:outfitIds});
  const built=buildScene(m.w);
  G={m:m,onEnd:onEnd,opts:opts,scene:built.scene,sun:built.sun,sunDir:built.sunDir,sky:built.sky,chestV:built.chestV,storm:built.storm,nextZ:built.nextZ,bus:built.bus,
   cam:new THREE.PerspectiveCamera(64,window.innerWidth/window.innerHeight,.1,1600),vis:{},itemV:new Map(),raf:0,last:performance.now(),acc:0,t:0,hudT:0,msgT:0,hit:0,
   yaw:m.player.team===0?Math.atan2(m.bus.dx,m.bus.dz):0,pitch:-.1,sens:1,ads:false,locked:false,noLock:false,paused:false,dead:false,finished:false,spec:null,tx:0,tz:0,camP:null,mapImg:null};
  for(const k in keys)keys[k]=false;
  initFx();G.mapImg=buildMapImage(m.w);
  m.ents.forEach(e=>{const ai=e.isPlayer?null:opts.allies[e.id-1];G.vis[e.id]=buildEntVisual(e,e.isPlayer?{back:opts.back,pick:opts.pick,glider:opts.glider}:(e.ally&&ai?{full:true,back:ai.back,pick:ai.pick}:null))});
  el.feed.innerHTML='';el.gcard.hidden=true;el.bigmap.hidden=true;el.gMute.textContent=muted?'Sound off':'Sound on';el.gLeave.hidden=true;el.gmsg.textContent='';
  document.addEventListener('keydown',onKD);document.addEventListener('keyup',onKU);el.gcv.addEventListener('mousedown',onMouseDown);document.addEventListener('mouseup',onMouseUp);document.addEventListener('mousemove',onMouseMove);
  el.gcv.addEventListener('wheel',onWheel,{passive:true});document.addEventListener('pointerlockchange',onLockChange);document.addEventListener('pointerlockerror',onLockError);document.addEventListener('contextmenu',onCtx);
  el.hotbar.addEventListener('pointerdown',onHotbar);window.addEventListener('resize',onResize);
  if(isTouch)bindTouch();else lock();
  ac();if(audio&&audio.resume)audio.resume();
  if(m.clash){msg('Team Clash: first to '+m.scoreLimit+' eliminations',3.5)}else msg('Space to jump from the bus',4);
  G.raf=requestAnimationFrame(frame);return true}
 function stop(){if(!G)return;cancelAnimationFrame(G.raf);document.removeEventListener('keydown',onKD);document.removeEventListener('keyup',onKU);el.gcv.removeEventListener('mousedown',onMouseDown);document.removeEventListener('mouseup',onMouseUp);document.removeEventListener('mousemove',onMouseMove);
  el.gcv.removeEventListener('wheel',onWheel);document.removeEventListener('pointerlockchange',onLockChange);document.removeEventListener('pointerlockerror',onLockError);document.removeEventListener('contextmenu',onCtx);el.hotbar.removeEventListener('pointerdown',onHotbar);window.removeEventListener('resize',onResize);
  if(document.exitPointerLock)try{document.exitPointerLock()}catch(e){}
  G.scene.traverse(o=>{if(o.geometry)o.geometry.dispose()});G.scene=null;el.game.hidden=true;G=null}
 function result(){const m=G.m,p=m.player;const win=m.winner===p.team;return {clash:m.clash,win:win,placement:m.clash?(win?1:0):(p.placement||(win?1:99)),kills:p.kills,score:m.score.slice(),mode:m.mode}}
 function finish(){if(!G)return;const r=result(),cb=G.onEnd;stop();if(cb)cb(r)}
 function quit(){if(!G)return;const m=G.m,p=m.player;if(!m.over&&!m.clash&&p.alive){p.alive=false;p.placement=m.aliveTeams()>1?m.aliveTeams():2}finish()}
 return {start:start,stop:stop,resume:resume,finish:finish,quit:quit,keepWatching:()=>{if(G){el.gcard.hidden=true;cycleSpec()}},toggleMute:()=>{muted=!muted;el.gMute.textContent=muted?'Sound off':'Sound on'},toggleMap:()=>{el.bigmap.hidden=!el.bigmap.hidden},active:()=>!!G}
})();

/* ---------- events ---------- */
const ACT={
 backdrop(d,e){if(e.target===$('#modal'))closeModal()},close(){closeModal()},
 tab(d){closeModal();setTab(d.tab)},play(){startPlay()},cancelq(){cancelQueue()},
 modes(){openModes()},setmode(d){setMode(d.id)},setsize(d){setSize(+d.n)},
 leftTab(d){leftTab=d.t;renderLeft()},invite(d){invite(d.id)},kick(d){kick(d.id)},
 emote(d){playEmote(d.id)},cat(d){S.cat=d.t;save();renderView()},
 equip(d){equip(d.id)},
 buy(d){openBuy(d.id)},confirmbuy(d){buy(d.id)},bonus(){claimBonus()},
 claim(d){claimReward(d.track,+d.t)},claimall(){claimAll()},premium(){openPremium()},
 dopremium(){if(S.vb<PREMIUM_COST)return;S.vb-=PREMIUM_COST;S.premium=true;save();closeModal();toast('Premium unlocked');renderTop();renderView()},
 buytier(){if(tier()>=TIERS)return;if(S.vb<TIER_COST){toast('Not enough Volts');return}S.vb-=TIER_COST;S.xp=(tier()+1)*XPT;save();toast('Tier '+tier()+' unlocked');renderTop();renderView()},
 quest(d){claimQuest(d.id)},profile(){openProfile()},leave(){endMatch()},
 gresume(){Game.resume()},gquit(){Game.quit()},gspec(){Game.keepWatching()},gdone(){Game.finish()},gmute(){Game.toggleMute()},gmap(){Game.toggleMap()},
 resetask(){const b=$('[data-act=resetask]');b.textContent='Tap again to erase everything';b.dataset.act='resetdo'},
 resetdo(){try{localStorage.removeItem(SAVE)}catch(e){}load();ensureQuests();save();closeModal();syncLook();render();toast('Progress reset')}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const f=ACT[b.dataset.act];if(f)f(b.dataset,e)});
document.addEventListener('submit',e=>{e.preventDefault();const id=e.target.id;
 if(id==='chatForm'){const i=$('#chatIn');sendChat(i.value);i.value=''}
 else if(id==='friendForm'){const i=$('#friendIn');addFriend(i.value);i.value=''}
 else if(id==='nameForm'){const v=$('#nameIn').value.trim().slice(0,16);if(v){S.name=v;save();toast('Name saved');renderTop();syncLook();renderLeft()}}});
document.addEventListener('change',e=>{if(e.target.dataset.chg==='region'){S.region=e.target.value;save();renderRight()}});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){if(!$('#modal').hidden)closeModal();return}
 if(Game.active()||S.tab!=='play'||!$('#modal').hidden||!$('#match').hidden)return;const tg=e.target.tagName;if(tg==='INPUT'||tg==='SELECT'||tg==='TEXTAREA')return;
 const n=parseInt(e.key,10);if(n>=1&&n<=6){const b=Stage.el.querySelectorAll('.emotebar button')[n-1];if(b)playEmote(b.dataset.id)}});
setInterval(()=>{const c=$('#shopClock');if(c)c.textContent=hms(secsToMidnight());if(mm.phase==='queue')renderQbar()},1000);

/* ---------- boot ---------- */
Stage.init();
S.party.forEach(id=>{ready[id]=true});
if(!['play','locker','shop','pass','quests'].includes(S.tab))S.tab='play';
render();renderQbar();
})();
</script>
